<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widht=device-width, initial-scale=1.0">
    <title>LABRADOR GANK</title>

    <style>
        body{
            margin:0;
            font-family:arial;
            background:#0f172a;
            color:white;
            padding:40px;
        }

        h1{
            text-align:center;
            margin-bottom:40px;
        }

        .container{
            display:flex;
            gap:20px;
            justify-content:center;
            flex-wrap:wrap;
        }

        .card{
            background:#1e293b;
            padding:20px;
            border-radius:20px;
            width:220px;
            text-align:center;
            cursor:pointer;
            transition:0.3s;
        }

        .card:hover{
            transform:scale(1.05);
            background:#334155;
        }

        .popup{
            position:fixed;
            top:50%;
            left:50%;
            transform:translate(-50%,-50%);
            background:#1e293b;
            width:300px;
            padding:25px;
            border-radius:25px;
            display:none;
            box-shadow:0 0 20px rgba(0,0,0,0.5);
        }

        .popup button{
            margin-top:15px;
            padding:10px 15px;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }

        .overlay{
            position:fixed;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
            top:0;
            left:0;
            display:none;
        }
    </style>
   </hand>
   <body>

    <h1>labrador comunity</h1>

    <div class="container">

        <div class="card" onclick="bukaPopup(
            'byan',
            'byan adalah patwal sejati labrador gank yang setia mengawal para member labrador.'
        )">
        <h2>byan</h2>
        <p>klik untuk melihat profile</p>
    </div>

    <div class="card" onclick="bukaPopup(
        'teteh gaul',
        'teteh gaul adalah sosok pembasmi para makhluk NPD di luar sana yang berkeliaran dan mengganggu'
    )">
    <h2>teteh gaul</h2>
    <p>klik untuk membuka profile</p>
    </div>

    <div class="card" onclick="bukaPopup(
        'abuzar ketua bucin',
        'manusia yang mempunyai genre romance paling brutal di labrador gank, cewenya 10 jir awkooaowko'
    )">
    <h2>abuzar ketua bucin</h2>
    <p>klik untuk membuka profile</p>
    </div>

    </div>

    <div class="overlay" id="overlay"></div>

    <div class="popup" id="popup">
        <h2 id="nama"></h2>
        <p id="deskripsi"></p>

        <button onclick="tutupPopup()">
            tutup
        </button>
    </div>

    <script>

        function bukaPopup(nama, deskripsi){
            document.getElementById("popup").style.display = "block";
            document.getElementById("overlay").style.display = "block";

            document.getElementById("nama").innerText = nama;
            document.getElementById("deskripsi").innerText = deskripsi;
        }

        function tutupPopup(){
            document.getElementById("popup").style.display = "none";
            document.getElementById("overlay").style.display = "none";
        }


    </script>

</body>
</html>
